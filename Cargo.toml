[package]
name = "opensourcellmrouter"
version = "0.8.0"
edition = "2024"
description = "A fast, local-first LLM router — proxy any OpenAI/Anthropic/Ollama client to your own provider pipeline with classifiers, cost/latency/random routing rules, plugins, a live dashboard, and a TUI."
license = "MIT"
repository = "https://github.com/CarterCole/opensourcellmrouter"
homepage = "https://github.com/CarterCole/opensourcellmrouter"
documentation = "https://github.com/CarterCole/opensourcellmrouter/tree/master/docs"
readme = "README.md"
keywords = ["llm", "ai", "proxy", "router", "ollama"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]
exclude = [".env", "logs/", "config.toml", "CLAUDE.md"]

[features]
# Run the `cev` classifier's model in-process (`model = "..."` under
# `[classifiers.cev]`) instead of talking to a `cev` server over HTTP. On
# macOS this uses Metal and Accelerate (see the target-specific dependency
# below).
cev-local = ["cev-rs/local", "dep:cev-runtime", "dep:cev-model"]
# Run the in-process model on an NVIDIA GPU.
cuda = ["cev-local", "cev-model/cuda"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.9"
cev-core = "0.2.1"
cev-model = { version = "0.2.1", optional = true }
cev-rs = "0.2.1"
cev-runtime = { version = "0.2.1", optional = true }
futures-core = "0.3.32"
futures-util = "0.3.32"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.11.1"
rand = "0.8"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto", "reqwest-client", "trace", "metrics", "logs",
] }
tracing-opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.32"
tower-http = { version = "0.6", features = ["trace"] }

[target.'cfg(target_os = "macos")'.dependencies]
cev-model = { version = "0.2.1", optional = true, features = ["metal", "accelerate"] }

[dev-dependencies]
# Tests run the `cev` classifier against cev's mock backend, in-process.
cev-rs = { version = "0.2.1", features = ["local"] }
cev-runtime = "0.2.1"
