<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>opensourcellmrouter — live requests</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0f1115;
    --panel: #181b22;
    --border: #2a2e38;
    --text: #e6e6e6;
    --muted: #9aa0ac;
    --accent: #4f8cff;
    --error: #ff5f5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  #status {
    font-size: 0.8rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  #status.connected { color: #6ee7a0; border-color: #2d4a36; }
  #status.disconnected { color: var(--error); border-color: #4a2d2d; }
  #count { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
  main { padding: 0.75rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .entry {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 0.6rem 0.8rem;
  }
  .entry.error { border-color: #4a2d2d; }
  .row1 {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .provider {
    font-weight: 600;
    color: var(--accent);
  }
  .model { color: var(--muted); }
  .arrow { color: var(--muted); }
  .duration { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-block;
    font-size: 0.7rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .pill.tag { border-color: #3a4a6b; color: #9cc0ff; }
  .pill.plugin { border-color: #4a3a6b; color: #c39cff; }
  .pill.response-tag { border-color: #6b3a3a; color: #ff9c9c; }
  .route {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-wrap: wrap;
    margin-top: 0.4rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .route button {
    font: inherit;
    font-size: 0.7rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .route button:hover:enabled { border-color: var(--accent); color: var(--text); }
  .route button:disabled { cursor: default; }
  .route button.picked { border-color: var(--accent); color: var(--accent); }
  .route button.labeled { border-color: #2d4a36; color: #6ee7a0; }
  .route .failed { color: var(--error); }
  .body { margin-top: 0.4rem; display: grid; gap: 0.3rem; }
  .prompt, .response, .error-msg {
    font-size: 0.8rem;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 4.5em;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .prompt.expanded, .response.expanded, .error-msg.expanded {
    max-height: none;
  }
  .label { color: var(--muted); margin-right: 0.4em; }
  .error-msg { color: var(--error); }
  .usage { color: var(--muted); font-size: 0.75rem; }
  .entry.inflight { border-color: #3a4a6b; opacity: 0.7; }
  .inflight-spinner { color: #9cc0ff; font-size: 1.1em; }
  .in-flight-badge {
    font-size: 0.75rem;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    border: 1px solid #3a4a6b;
    color: #9cc0ff;
  }
</style>
</head>
<body>
<header>
  <h1>opensourcellmrouter</h1>
  <span id="status" class="disconnected">connecting…</span>
  <span id="count"></span>
</header>
<main id="entries"></main>
<script>
const MAX_ENTRIES = 200;
const entriesEl = document.getElementById('entries');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');
let count = 0;
// Map from request id → placeholder element for in-flight requests.
const inFlight = new Map();

function fmtTime(ms) {
  const d = new Date(ms);
  return d.toLocaleTimeString();
}

// A message's content is a list of parts (text, images, tool calls and
// results); only the text parts are shown.
function textOf(message) {
  return message.content.filter(p => p.type === 'text').map(p => p.text).join('');
}

function lastUserMessage(messages) {
  for (let i = messages.length - 1; i >= 0; i--) {
    if (messages[i].role === 'user') return textOf(messages[i]);
  }
  return messages.length ? textOf(messages[messages.length - 1]) : '';
}

function pill(text, cls) {
  const span = document.createElement('span');
  span.className = 'pill ' + cls;
  span.textContent = text;
  return span;
}

function toggleExpand(e) {
  e.currentTarget.classList.toggle('expanded');
}

// A classifier's pick for a request. For cev: one button per model it chose
// between, with the probability it gave each. Clicking a model reports it
// as the one that should have answered, which cev learns from. An llm pick
// has neither probabilities nor a decision to correct, so it's just named;
// with cev enabled too, it labels cev's decision, and cev's row says whether
// the two agree.
function renderRoute(entry, route) {
  const row = document.createElement('div');
  row.className = 'route';

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = route.classifier + ':';
  row.appendChild(label);

  const status = document.createElement('span');
  const used = entry.provider === route.provider && entry.sent_model === route.model;
  if (!route.decision_id) {
    status.textContent = ['picked ' + route.choice, used ? '' : 'not used'].filter(Boolean).join(' · ');
    row.appendChild(status);
    return row;
  }
  const llm = entry.routes.find(r => r.classifier === 'llm');
  const agrees = llm && llm.provider === route.provider && llm.model === route.model;
  status.textContent = [
    Math.round(route.confidence * 100) + '% confident',
    route.adapted ? 'adapted' : '',
    used ? '' : 'not used',
    llm ? (agrees ? 'agrees with llm' : 'llm picked ' + llm.choice) : '',
    'click the right model',
  ].filter(Boolean).join(' · ');

  const buttons = [];
  for (const [name, probability] of Object.entries(route.probabilities)) {
    const button = document.createElement('button');
    if (name === route.choice) button.className = 'picked';
    button.textContent = name + ' ' + Math.round(probability * 100) + '%';
    button.addEventListener('click', async () => {
      for (const b of buttons) b.disabled = true;
      status.className = '';
      status.textContent = 'sending…';
      try {
        // ?api_key=... carries through, as for the event stream below.
        const resp = await fetch('/v1/feedback' + location.search, {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({decision_id: route.decision_id, label: name}),
        });
        const body = await resp.json();
        if (!resp.ok) throw new Error(body.error.message);
        button.classList.add('labeled');
        status.textContent = [
          'labeled ' + name,
          body.task_examples + ' label' + (body.task_examples === 1 ? '' : 's'),
          body.adapter_active ? 'adapter active' : 'adapter not active yet',
        ].join(' · ');
      } catch (err) {
        for (const b of buttons) b.disabled = false;
        status.className = 'failed';
        status.textContent = 'feedback failed: ' + err.message;
      }
    });
    buttons.push(button);
    row.appendChild(button);
  }

  row.appendChild(status);
  return row;
}

function renderEntry(entry) {
  const el = document.createElement('div');
  el.className = 'entry' + (entry.error ? ' error' : '');

  const row1 = document.createElement('div');
  row1.className = 'row1';

  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = fmtTime(entry.ts_ms);
  row1.appendChild(time);

  const provider = document.createElement('span');
  provider.className = 'provider';
  provider.textContent = entry.provider;
  row1.appendChild(provider);

  const model = document.createElement('span');
  model.className = 'model';
  if (entry.requested_model !== entry.sent_model) {
    model.innerHTML = '';
    model.append(entry.requested_model, ' ');
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '→';
    model.appendChild(arrow);
    model.append(' ' + entry.sent_model);
  } else {
    model.textContent = entry.sent_model;
  }
  row1.appendChild(model);

  for (const tag of entry.tags || []) row1.appendChild(pill(tag, 'tag'));
  for (const plugin of entry.plugins || []) row1.appendChild(pill(plugin, 'plugin'));
  for (const tag of (entry.response && entry.response.tags) || []) row1.appendChild(pill(tag, 'response-tag'));

  const duration = document.createElement('span');
  duration.className = 'duration';
  duration.textContent = entry.duration_ms + ' ms';
  row1.appendChild(duration);

  el.appendChild(row1);
  for (const route of entry.routes || []) el.appendChild(renderRoute(entry, route));

  const body = document.createElement('div');
  body.className = 'body';

  const prompt = document.createElement('div');
  prompt.className = 'prompt';
  prompt.addEventListener('click', toggleExpand);
  const promptLabel = document.createElement('span');
  promptLabel.className = 'label';
  promptLabel.textContent = 'prompt:';
  prompt.appendChild(promptLabel);
  prompt.append(lastUserMessage(entry.messages || []));
  body.appendChild(prompt);

  if (entry.error) {
    const err = document.createElement('div');
    err.className = 'error-msg';
    err.addEventListener('click', toggleExpand);
    const errLabel = document.createElement('span');
    errLabel.className = 'label';
    errLabel.textContent = 'error:';
    err.appendChild(errLabel);
    err.append(entry.error);
    body.appendChild(err);
  } else if (entry.response) {
    const resp = document.createElement('div');
    resp.className = 'response';
    resp.addEventListener('click', toggleExpand);
    const respLabel = document.createElement('span');
    respLabel.className = 'label';
    respLabel.textContent = 'response:';
    resp.appendChild(respLabel);
    resp.append(entry.response.content || '');
    body.appendChild(resp);

    if (entry.response.usage) {
      const usage = document.createElement('div');
      usage.className = 'usage';
      usage.textContent =
        `${entry.response.usage.input_tokens} in / ${entry.response.usage.output_tokens} out tokens · ${entry.response.stop_reason}`;
      body.appendChild(usage);
    }
  }

  el.appendChild(body);
  return el;
}

function renderStart(event) {
  const el = document.createElement('div');
  el.className = 'entry inflight';
  const row1 = document.createElement('div');
  row1.className = 'row1';

  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = fmtTime(event.ts_ms);
  row1.appendChild(time);

  const spinner = document.createElement('span');
  spinner.className = 'inflight-spinner';
  spinner.textContent = '⋯';
  row1.appendChild(spinner);

  const model = document.createElement('span');
  model.className = 'model';
  model.textContent = event.model;
  row1.appendChild(model);

  const badge = document.createElement('span');
  badge.className = 'in-flight-badge';
  badge.textContent = event.in_flight + ' in flight';
  row1.appendChild(badge);

  el.appendChild(row1);
  inFlight.set(event.id, el);
  entriesEl.insertBefore(el, entriesEl.firstChild);
}

function connect() {
  // Carries ?api_key=... through from the /dashboard URL, since
  // EventSource can't set custom headers — see server::presented_key.
  const es = new EventSource('/dashboard/events' + location.search);

  es.onopen = () => {
    statusEl.textContent = 'connected';
    statusEl.className = 'connected';
  };

  es.onerror = () => {
    statusEl.textContent = 'disconnected — retrying…';
    statusEl.className = 'disconnected';
  };

  es.onmessage = (ev) => {
    let event;
    try {
      event = JSON.parse(ev.data);
    } catch {
      return;
    }

    if (event.type === 'start') {
      renderStart(event);
      return;
    }

    if (event.type === 'classified') {
      const el = inFlight.get(event.id);
      if (el && event.tags && event.tags.length) {
        const row1 = el.querySelector('.row1');
        for (const tag of event.tags) row1.appendChild(pill(tag, 'tag'));
      }
      return;
    }

    if (event.type === 'routed') {
      const el = inFlight.get(event.id);
      if (el) {
        const providerEl = el.querySelector('.provider') || document.createElement('span');
        providerEl.className = 'provider';
        providerEl.textContent = event.provider;
        const modelEl = el.querySelector('.model');
        if (modelEl) modelEl.textContent = event.model;
        const row1 = el.querySelector('.row1');
        if (!el.querySelector('.provider')) {
          const spinner = row1.querySelector('.inflight-spinner');
          spinner.after(providerEl);
        }
      }
      return;
    }

    if (event.type === 'complete') {
      // Remove the in-flight placeholder if it exists.
      const placeholder = inFlight.get(event.id);
      if (placeholder) {
        placeholder.remove();
        inFlight.delete(event.id);
      }
      count++;
      countEl.textContent = count + ' request' + (count === 1 ? '' : 's');
      // The Complete variant has LogEntry fields flattened at the top level.
      entriesEl.insertBefore(renderEntry(event), entriesEl.firstChild);
      while (entriesEl.children.length > MAX_ENTRIES) {
        entriesEl.removeChild(entriesEl.lastChild);
      }
    }
  };
}

connect();
</script>
</body>
</html>
